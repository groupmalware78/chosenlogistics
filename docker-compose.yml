services:
  postgres:
    image: postgres:16-alpine
    container_name: chosen-logistics-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chosen_logistics_dev
    ports:
      - "5433:5432"
    volumes:
      - chosen_logistics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  chosen_logistics_pgdata:
